[package]
name = "pallet-bridge"
description = "Pallet for interchain communication"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

frame = { workspace = true, default-features = false, features = ["experimental", "runtime" ] }

sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2503", default-features = false, features = ["serde"] }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "stable2503", default-features = false, features = ["serde"] }

[features]
default = ["std"]
runtime-benchmarks = ["frame/runtime-benchmarks"]
std = ["codec/std", "frame/std", "scale-info/std", "sp-core/std", "sp-runtime/std"]
try-runtime = ["frame/try-runtime"]

[lints]
workspace = true
